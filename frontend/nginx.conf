# Real protocol when a TLS proxy (Caddy) sits in front; nginx's own scheme otherwise
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API calls go to the gateway container
  location /api/ {
    proxy_pass http://api-gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Append this hop so the gateway can rate-limit per visitor (see TRUST_PROXY)
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # Single-page app: any other path serves index.html
  location / {
    try_files $uri /index.html;
  }
}
